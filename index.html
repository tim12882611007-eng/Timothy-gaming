
<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIMOTHY ONLINE 1V1</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;color:#fff;font-family:Arial;text-align:center}.top{padding:10px;background:linear-gradient(#1a2a4a,#000);border-bottom:2px solid gold;display:flex;justify-content:space-between}.card{display:inline-block;background:#1a1a2a;border:2px solid #333;border-radius:10px;padding:10px;margin:5px;width:90px;cursor:pointer}.card.sel{border-color:lime;box-shadow:0 0 10px lime}.card.vip{border-color:gold}.btn{padding:12px 18px;border:none;border-radius:10px;font-weight:bold;margin:5px;cursor:pointer}.y{background:gold;color:#000}.b{background:#222;color:#fff;border:1px solid #555}canvas{background:#111;display:block;margin:10px auto;border:2px solid gold;border-radius:12px}#battle{display:none;position:fixed;inset:0;background:#000;z-index:99;padding:5px}.bar{height:12px;background:#222;border-radius:10px;overflow:hidden;border:1px solid #555}.fill{height:100%}</style></head><body><div class="top"><b>⚔️ TIMOTHY LEGENDS</b><span>💎9999 VIP5</span></div><div id="lobby" style="padding:10px"><h2 style="color:gold">ONLINE 1V1 READY!</h2><div id="heroes"></div><div style="margin:10px;background:#111;padding:8px;border-radius:10px"><b>🗡️ SWORD:</b> <span id="swordName" style="color:cyan">Basic Sword</span><div id="swords" style="margin-top:6px"></div></div><div style="background:#111;border:1px solid gold;border-radius:12px;padding:12px;max-width:360px;margin:10px auto"><h3>🌐 ONLINE 1V1</h3><button class="btn y" onclick="createRoom()">🔥 CREATE ROOM</button><br><div id="myCode" style="margin:8px;color:gold;font-weight:bold"></div><hr style="margin:10px"><input id="joinCode" placeholder="ENTER CODE" style="padding:10px;border-radius:8px;border:1px solid #555;background:#000;color:#fff;width:200px;text-align:center"><br><button class="btn b" onclick="joinRoom()">⚔️ JOIN ROOM</button><div id="status" style="margin-top:8px;color:lime"></div></div><button class="btn b" onclick="startBot()">🤖 VS BOT</button></div><div id="battle"><div style="display:flex;gap:6px"><div style="flex:1"><div id="n1">YOU</div><div class="bar"><div id="hp1" class="fill" style="width:100%;background:lime"></div></div></div><div style="color:gold;font-weight:bold;padding-top:5px">VS</div><div style="flex:1"><div id="n2">ENEMY</div><div class="bar"><div id="hp2" class="fill" style="width:100%;background:red"></div></div></div></div><canvas id="cv" width="350" height="300"></canvas><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:360px;margin:auto"><button class="btn b" onclick="doSkill(0)">👊 PUNCH</button><button class="btn b" onclick="doSkill(1)">🔥 FIRE</button><button class="btn y" onclick="doSkill(2)">⚡ ULTI</button><button class="btn b" onclick="doSkill(3)">🗡️ SWORD</button></div><button class="btn b" onclick="location.reload()" style="margin-top:8px">EXIT</button></div><script>const HERO=["Timothy","Shadow","Blaze","Frost","Viper","Titan","Storm","Reaper","Ninja","Golem","Phoenix","Void"];const SWORD=[{n:"Basic Sword",d:10},{n:"Flame Sword",d:18},{n:"Ice Blade",d:22,vip:1},{n:"Thunder Katana",d:30,vip:1},{n:"Dragon Slayer",d:40,vip:1},{n:"Void Reaper",d:55,vip:1},{n:"God Sword TIMO",d:99,vip:1}];let myHero=0,mySword=0,myHP=100,enemyHP=100,peer,conn,isHost=false,roomCode="";const cv=document.getElementById('cv'),ctx=cv.getContext('2d');function renderHeroes(){let h=document.getElementById('heroes');h.innerHTML="";HERO.forEach((x,i)=>{h.innerHTML+=`<div class="card ${i==myHero?'sel':''}" onclick="myHero=${i};renderHeroes()"><div style="font-size:26px">🦸</div><b style="font-size:10px">${x}</b></div>`});}function renderSwords(){let s=document.getElementById('swords');s.innerHTML="";SWORD.forEach((x,i)=>{s.innerHTML+=`<div class="card ${x.vip?'vip':''} ${i==mySword?'sel':''}" style="width:75px;padding:5px" onclick="mySword=${i};document.getElementById('swordName').innerText=x.n+' +'+x.d"><div style="font-size:16px">🗡️</div><div style="font-size:8px">${x.n}</div></div>`});}renderHeroes();renderSwords();function genCode(){return "TIMO-"+Math.floor(100+Math.random()*899)}function createRoom(){roomCode=genCode();document.getElementById('myCode').innerText="CODE: "+roomCode+" Send to friend!";document.getElementById('status').innerText="Creating...";isHost=true;peer=new Peer(roomCode);peer.on('open',()=>{document.getElementById('status').innerText="Waiting... Share code!";});peer.on('connection',c=>{conn=c;setupConn();startGame(true)});}function joinRoom(){let code=document.getElementById('joinCode').value.trim().toUpperCase();if(!code)return alert("Enter code!");roomCode=code;isHost=false;peer=new Peer();peer.on('open',()=>{conn=peer.connect(roomCode);setupConn();document.getElementById('status').innerText="Connecting...";});}function setupConn(){conn.on('open',()=>{startGame(false)});conn.on('data',d=>{if(d.type=='hit'){myHP-=d.dmg;if(myHP<0)myHP=0;updateHP();if(myHP<=0)endGame(false);}if(d.type=='start'){document.getElementById('n2').innerText=HERO[d.hero]}});conn.on('close',()=>alert("Enemy left"));}function startGame(host){document.getElementById('lobby').style.display='none';document.getElementById('battle').style.display='flex';document.getElementById('battle').style.flexDirection='column';document.getElementById('n1').innerText=HERO[myHero]+" ("+SWORD[mySword].n+")";myHP=100;enemyHP=100;updateHP();draw();if(host&&conn)conn.send({type:'start',hero:myHero});}function startBot(){document.getElementById('lobby').style.display='none';document.getElementById('battle').style.display='flex';document.getElementById('battle').style.flexDirection='column';document.getElementById('n2').innerText="BOT";myHP=100;enemyHP=100;updateHP();draw();setInterval(()=>{if(enemyHP>0&&myHP>0&&!conn){myHP-=Math.floor(Math.random()*8);if(myHP<0)myHP=0;updateHP();if(myHP<=0)endGame(false)}},1000);}function doSkill(i){let dmg=[8,15,25,SWORD[mySword].d][i];enemyHP-=dmg;if(enemyHP<0)enemyHP=0;updateHP();drawHit();if(conn&&conn.open)conn.send({type:'hit',dmg:dmg});if(enemyHP<=0)endGame(true);}function updateHP(){document.getElementById('hp1').style.width=myHP+"%";document.getElementById('hp2').style.width=enemyHP+"%";}function draw(){ctx.clearRect(0,0,350,300);ctx.fillStyle="#222";ctx.fillRect(0,250,350,50);ctx.fillStyle="cyan";ctx.fillRect(80,150,40,60);ctx.fillStyle="red";ctx.fillRect(230,150,40,60);ctx.fillStyle="#fff";ctx.font="12px Arial";ctx.fillText(HERO[myHero],75,140);ctx.fillStyle="gold";ctx.fillRect(100,160,60,6);}function drawHit(){ctx.fillStyle="yellow";ctx.font="bold 20px Arial";ctx.fillText("- DMG!",220,120);setTimeout(draw,300);}function endGame(win){setTimeout(()=>alert(win?"VICTORY BOSS! 👑":"DEFEAT!"),200);}</script></body></html>
