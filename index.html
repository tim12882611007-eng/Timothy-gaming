<script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio,2);
function resize(){W=innerWidth;H=innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);mini.width=90*dpr;mini.height=90*dpr;mini.style.width='90px';mini.style.height='90px';mctx.setTransform(dpr,0,0,dpr,0,0);} resize();addEventListener('resize',resize);
let diamonds=500,hp=100,maxHp=100,exp=0,level=1,kills=0,damageBonus=0,speedBonus=0;
let player={x:0,y:0,vx:0,vy:0,angle:0,form:0},camera={x:0,y:0},keys={},joy={dx:0,dy:0,active:false},shooting=false,shootCd=0;
let bullets=[],enemies=[],particles=[],decor=[],buildings=1,currentTab='hero';
let ownedHero=[0,1],ownedWeap=[0],ownedPet=[],ownedSkill=[0],equipped=0,equippedWeap=0,equippedPet=-1;
const HEROES=[
{id:0,name:"Rimuru Slime",icon:"🔵",price:0,power:100,desc:"Starter - Predator"},
{id:1,name:"Rimuru Human",icon:"🧑‍🦱",price:0,power:120,desc:"Silver hair + rapier"},

{id:4,name:"Milim Nava",icon:"🐉",price:3000,power:220,desc:"Dragonoid - explosion"},

{id:0,name:"Water Blade",icon:"💧",price:0,dmg:20,desc:"Rimuru basic"},
{id:1,name:"Flame Sword",icon:"🗡️🔥",price:400,dmg:35,desc:"Benimaru fire"},
{id:2,name:"Ice Spear",icon:"❄️",price:900,dmg:50,desc:"Freeze enemy"},
{id:3,name:"Thunder Gun",icon:"⚡",price:1800,dmg:70,desc:"Fast + stun"},
{id:4,name:"Dragon Buster",icon:"🐉💥",price:3500,dmg:110,desc:"Veldora breath"}

{id:0,name:"Ranga Wolf",icon:"🐺",price:600,desc:"Bite enemy"},
{id:1,name:"Slime Pet",icon:"🟢",price:1000,desc:"+10% exp"},
{id:2,name:"Mini Veldora",icon:"🐲",price:2500,desc:"Burn all"}
];

{id:0,name:"Predator",icon:"👄",price:0,desc:"Eat enemy + skill"},
{id:1,name:"Great Sage",icon:"🧠",price:500,desc:"Show weakness"},
{id:2,name:"Shadow Step",icon:"👤",price:1200,desc:"Dash x2"},
{id:3,name:"Beelzebuth",icon:"🌀",price:4000,desc:"Ultimate eat all"}
];
const ET={slime:{hp:35,speed:55,color:"#00aaff",size:14,reward:6,exp:10},orc:{hp:95,speed:72,color:"#8B4513",size:20,reward:16,exp:25},demon:{hp:140,speed:84,color:"#6a1b9a",size:22,reward:32,exp:50},dragon:{hp:450,speed:58,color:"#cc0000",size:38,reward:130,exp:200}};
function init(){
decor=[];for(let i=0;i<110;i++){let x=(Math.random()-0.5)*5000,y=(Math.random()-0.5)*5000;if(Math.hypot(x,y)<280)continue;decor.push({x,y,r:18+Math.random()*24,t:Math.floor(Math.random()*3)});}
enemies=[];for(let i=0;i<16;i++)enemies.push({x:(Math.random()-0.5)*1600,y:(Math.random()-0.5)*1600,type:"slime",hp:ET.slime.hp,max:ET.slime.hp});
for(let i=0;i<12;i++){let a=Math.random()*6.28,d=1100+Math.random()*900;enemies.push({x:Math.cos(a)*d,y:Math.sin(a)*d,type:"orc",hp:ET.orc.hp,max:ET.orc.hp});}
for(let i=0;i<9;i++){let a=Math.random()*6.28,d=1900+Math.random()*900;enemies.push({x:Math.cos(a)*d,y:Math.sin(a)*d,type:"demon",hp:ET.demon.hp,max:ET.demon.hp});}
for(let i=0;i<3;i++){let a=Math.random()*6.28,d=2600+Math.random()*700;enemies.push({x:Math.cos(a)*d,y:Math.sin(a)*d,type:"dragon",hp:ET.dragon.hp,max:ET.dragon.hp});}
} init();
function drawRimuru(x,y,ang,form,scale=1){
ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(scale,scale);ctx.imageSmoothingQuality='high';
ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(0,14,12,5,0,0,6.28);ctx.fill();
if(form==0){ // slime
ctx.fillStyle='#00aaff';ctx.beginPath();ctx.arc(0,0,14,0,6.28);ctx.fill();ctx.fillStyle='#6dd8ff';ctx.beginPath();ctx.arc(-4,-4,5,0,6.28);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-4,-2,3,3.5,0,0,6.28);ctx.fill();ctx.beginPath();ctx.ellipse(4,-2,3,3.5,0,0,6.28);ctx.fill();
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-4,-1,1.4,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(4,-1,1.4,0,6.28);ctx.fill();
}else{
let col=form==2?'#000':'#1a1a2a';let skin='#ffdbac';
ctx.fillStyle=col;ctx.fillRect(-6,2,5,11);ctx.fillRect(1,2,5,11);ctx.fillStyle='#111';ctx.fillRect(-6,12,5,4);ctx.fillRect(1,12,5,4);
ctx.fillStyle=form==2?'#111':'#2a4a8a';ctx.beginPath();ctx.roundRect(-8,-8,16,14,4);ctx.fill();
ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-11,-5,5,10,3);ctx.fill();ctx.beginPath();ctx.roundRect(6,-5,5,10,3);ctx.fill();
ctx.fillStyle='#2b2b2b';ctx.fillRect(9,-3,18,4);
ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-13,9,0,6.28);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-3,-14,2.2,2.8,0,0,6.28);ctx.fill();ctx.beginPath();ctx.ellipse(3,-14,2.2,2.8,0,0,6.28);ctx.fill();
ctx.fillStyle='#00aaff';ctx.beginPath();ctx.arc(-3,-13.5,1.3,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(3,-13.5,1.3,0,6.28);ctx.fill();
if(form==2){ctx.fillStyle='#ffd700';ctx.beginPath();ctx.moveTo(-7,-22);ctx.lineTo(0,-30);ctx.lineTo(7,-22);ctx.fill();}
else{ctx.fillStyle='#c0c0ff';ctx.fillRect(-9,-20,18,6);}
}
ctx.restore();
}
function drawEnemy(sx,sy,en){
const t=ET[en.type];ctx.save();ctx.translate(sx,sy);
ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(0,t.size*0.6,t.size*0.7,t.size*0.35,0,0,6.28);ctx.fill();
if(en.type=='slime'){ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(0,0,t.size,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-3,2.8,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(4,-3,2.8,0,6.28);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-4,-2,1.3,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(4,-2,1.3,0,6.28);ctx.fill();}
else if(en.type=='orc'){ctx.fillStyle='#7bb37b';ctx.beginPath();ctx.arc(0,-2,t.size*0.7,0,6.28);ctx.fill();ctx.fillStyle=t.color;ctx.fillRect(-t.size*0.8,t.size*0.2,t.size*1.6,t.size*0.9);}
else if(en.type=='demon'){ctx.fillStyle='#9c27b0';ctx.beginPath();ctx.arc(0,0,t.size,0,6.28);ctx.fill();ctx.fillStyle='#ff0000';ctx.beginPath();ctx.arc(-5,-3,2.5,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(5,-3,2.5,0,6.28);ctx.fill();}
else{ctx.fillStyle='#b71c1c';ctx.beginPath();ctx.ellipse(0,0,t.size*1.2,t.size,0,0,6.28);ctx.fill();ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(-8,-6,2,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(8,-6,2,0,6.28);ctx.fill();}
ctx.fillStyle='#000';ctx.fillRect(-t.size,-t.size-10,t.size*2,5);ctx.fillStyle=en.type=='dragon'?'#f00':'#0f0';ctx.fillRect(-t.size,-t.size-10,t.size*2*en.hp/en.max,5);
ctx.restore();
}
function drawWorld(){
let dist=Math.hypot(camera.x,camera.y);
if(dist<900)ctx.fillStyle='#1b3d1b';else if(dist<1700)ctx.fillStyle='#2d3d1b';else if(dist<2500)ctx.fillStyle='#3d2a3a';else ctx.fillStyle='#3d1a1a';
ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(255,255,255,0.04)';for(let i=0;i<400;i++){let sx=((i*137)%W+camera.x*0.08)%W,sy=((i*239)%H+camera.y*0.08)%H;ctx.fillRect(sx,sy,2,2);}
let gx=W/2-camera.x,gy=H/2-camera.y;
ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(gx-62,gy+42,124,18);
ctx.fillStyle='#8B5A2B';ctx.fillRect(gx-56,gy-22,112,72);ctx.fillStyle='#5D4037';ctx.fillRect(gx-62,gy-32,124,18);
ctx.fillStyle='#ffd700';ctx.fillRect(gx-8,gy+12,16,26);ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.fillText('TEMPEST',gx-26,gy-36);
for(let i=0;i<buildings;i++){let bx=gx-50+i*16%100,by=gy-50-Math.floor(i/6)*16;ctx.fillStyle='#6a4a2a';ctx.fillRect(bx,by,10,10);}
for(let d of decor){let sx=W/2+d.x-camera.x,sy=H/2+d.y-camera.y;if(sx<-60||sx>W+60||sy<-60||sy>H+60)continue;ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(sx+5,sy+8,d.r*0.6,d.r*0.3,0,0,6.28);ctx.fill();ctx.fillStyle='#4a2c17';ctx.fillRect(sx-5,sy-4,10,18);ctx.fillStyle=d.t==0?'#2d7a2d':d.t==1?'#1e5e1e':'#3a8a3a';ctx.beginPath();ctx.arc(sx,sy-14,d.r,0,6.28);ctx.fill();}
}
let last=performance.now();
function loop(now){
let dt=Math.min((now-last)/1000,0.05);last=now;
let mx=joy.dx,my=joy.dy;if(keys['w']||keys['arrowup'])my=-1;if(keys['s']||keys['arrowdown'])my=1;if(keys['a']||keys['arrowleft'])mx=-1;if(keys['d']||keys['arrowright'])mx=1;
let baseSpeed=200+speedBonus*100+level*2;player.vx=mx*baseSpeed;player.vy=my*baseSpeed;if(mx||my)player.angle=Math.atan2(my,mx);
player.x+=player.vx*dt;player.y+=player.vy*dt;camera.x+=(player.x-camera.x)*0.09;camera.y+=(player.y-camera.y)*0.09;
shootCd-=dt;if(shooting&&shootCd<=0){shootCd=0.18;let we=WEAPONS[equippedWeap]||WEAPONS[0];let dmg=we.dmg+HEROES[equipped].power*0.12+damageBonus*50;bullets.push({x:player.x+20*Math.cos(player.angle),y:player.y+20*Math.sin(player.angle),vx:Math.cos(player.angle)*540,vy:Math.sin(player.angle)*540,dmg,life:1.2});}
bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;});bullets=bullets.filter(b=>b.life>0);
enemies.forEach(en=>{let t=ET[en.type],dx=player.x-en.x,dy=player.y-en.y,d=Math.hypot(dx,dy);if(d<650){en.x+=dx/d*t.speed*dt;en.y+=dy/d*t.speed*dt;}
bullets.forEach(b=>{if(Math.hypot(b.x-en.x,b.y-en.y)<t.size+6){en.hp-=b.dmg;b.life=0;particles.push({x:en.x,y:en.y,vx:(Math.random()-0.5)*200,vy:(Math.random()-0.5)*200,life:0.3,color:t.color});}});
if(d<t.size+12){hp-=t.reward*0.4*dt*5;if(navigator.vibrate)navigator.vibrate(20);}
if(en.hp<=0){let expGain=t.exp,need=level*50;diamonds+=t.reward;kills++;exp+=expGain;if(exp>=need){exp-=need;level++;maxHp+=6;hp=maxHp;damageBonus+=0.03;speedBonus+=0.015;buildings=Math.min(30,level);let lu=document.getElementById('lvlUp');lu.innerHTML='LEVEL UP!<br>LVL '+level+'<br>'+(level>=11?'DEMON LORD!':'RIMURU POWER!');lu.style.display='block';let sg=document.getElementById('sage');sg.innerText='Great Sage: Level increased to '+level+'! Predator success!';sg.style.display='block';setTimeout(()=>{lu.style.display='none';sg.style.display='none';},2200);if(navigator.vibrate)navigator.vibrate([80,40,80]);if(level>=6)player.form=1;if(level>=11)player.form=2;}en.x=(Math.random()-0.5)*5000;en.y=(Math.random()-0.5)*5000;let nd=Math.hypot(en.x,en.y);if(nd<900)en.type='slime';else if(nd<1800)en.type=Math.random()<0.7?'orc':'slime';else if(nd<2600)en.type=Math.random()<0.6?'demon':'orc';else en.type=Math.random()<0.5?'dragon':'demon';en.max=ET[en.type].hp;en.hp=en.max;particles.push({x:en.x,y:en.y,text:'+'+t.reward+'💎 +'+t.exp+'EXP',life:1,vy:-70});}
});
particles.forEach(p=>{p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;p.life-=dt;});particles=particles.filter(p=>p.life>0);
// minimap
mctx.clearRect(0,0,90,90);mctx.fillStyle='#0a1620';mctx.fillRect(0,0,90,90);enemies.forEach(en=>{let mx=45+en.x/90,my=45+en.y/90;if(mx<0||mx>90||my<0||my>90)return;mctx.fillStyle=ET[en.type].color;mctx.fillRect(mx,my,en.type=='dragon'?4:2,en.type=='dragon'?4:2);});mctx.fillStyle='#fff';mctx.fillRect(45+player.x/90-1,45+player.y/90-1,3,3);mctx.fillStyle='#ffd700';mctx.fillRect(45-2,45-2,4,4);
let distG=Math.hypot(player.x,player.y);document.getElementById('floatShop').style.display=distG<130?'block':'none';
ctx.clearRect(0,0,W,H);drawWorld();
enemies.forEach(en=>{let sx=W/2+en.x-camera.x,sy=H/2+en.y-camera.y;if(sx<-80||sx>W+80||sy<-80||sy>H+80)return;drawEnemy(sx,sy,en);});
ctx.fillStyle='#00ffff';bullets.forEach(b=>{let sx=W/2+b.x-camera.x,sy=H/2+b.y-camera.y;ctx.shadowColor='#0ff';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(sx,sy,5,0,6.28);ctx.fill();ctx.shadowBlur=0;});
particles.forEach(p=>{let sx=W/2+p.x-camera.x,sy=H/2+p.y-camera.y;if(p.text){ctx.fillStyle='#ffd700';ctx.font='bold 11px Arial';ctx.fillText(p.text,sx,sy);}else{ctx.fillStyle=p.color||'#0ff';ctx.fillRect(sx,sy,4,4);}});
drawRimuru(W/2,H/2,player.angle,player.form,1.35);
document.getElementById('diam').innerText=diamonds;document.getElementById('hp').innerText=Math.max(0,Math.floor(hp));document.getElementById('lvl').innerText=level;document.getElementById('kills').innerText=kills;document.getElementById('expBar').style.width=(exp/(level*50)*100)+'%';document.getElementById('formTxt').innerText=player.form==0?'SLIME':player.form==1?'RIMURU':'DEMON LORD';
if(hp<=0){hp=maxHp;player.x=0;player.y=150;exp=Math.max(0,exp-20);}
requestAnimationFrame(loop);
} requestAnimationFrame(loop);
const jw=document.getElementById('joyWrap'),j=document.getElementById('joy');
function setJoy(e){let r=jw.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.touches?e.touches[0].clientX:e.clientX)-cx,y=(e.touches?e.touches[0].clientY:e.clientY)-cy;let d=Math.hypot(x,y),max=42;if(d>max){x=x/d*max;y=y/d*max;}j.style.left=37+x+'px';j.style.top=37+y+'px';joy.dx=x/max;joy.dy=y/max;joy.active=true;}
function resetJoy(){j.style.left='37px';j.style.top='37px';joy.dx=0;joy.dy=0;joy.active=false;}
jw.addEventListener('touchstart',e=>{e.preventDefault();setJoy(e);});jw.addEventListener('touchmove',e=>{e.preventDefault();setJoy(e);});jw.addEventListener('touchend',e=>{e.preventDefault();resetJoy();});
jw.addEventListener('mousedown',e=>setJoy(e));addEventListener('mousemove',e=>{if(joy.active)setJoy(e);});addEventListener('mouseup',resetJoy);
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function doPred(){enemies.forEach(en=>{if(Math.hypot(player.x-en.x,player.y-en.y)<60){en.hp-=80;let sg=document.getElementById('sage');sg.innerText='Great Sage: Predator activated! Skill '+en.type+' acquired!';sg.style.display='block';setTimeout(()=>sg.style.display='none',1500);}});if(navigator.vibrate)navigator.vibrate(50);}
function doUlt(){let dmg=100+level*10+damageBonus*100;for(let k=0;k<18;k++){let a=k/18*6.28;bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,dmg,life:1.2});}if(navigator.vibrate)navigator.vibrate([60,40,90]);}
function toggleShop(){let m=document.getElementById('shop');m.style.display=m.style.display=='block'?'none':'block';render();}
function setTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.getElementById('t-'+t).classList.add('active');render();}
function render(){
let g=document.getElementById('grid');g.innerHTML='';let list=currentTab=='hero'?HEROES:currentTab=='weapon'?WEAPONS:currentTab=='pet'?PETS:SKILLS;
list.forEach(it=>{
let owned=currentTab=='hero'?ownedHero.includes(it.id):currentTab=='weapon'?ownedWeap.includes(it.id):currentTab=='pet'?ownedPet.includes(it.id):ownedSkill.includes(it.id);
let isEq=(currentTab=='hero'&&equipped==it.id)||(currentTab=='weapon'&&equippedWeap==it.id);
let div=document.createElement('div');div.className='card'+(owned?' owned':'');
div.innerHTML=`<div class="ic">${it.icon}</div><h3>${it.name}</h3><p>${it.desc}</p>${currentTab=='hero'?'<p>⚔️ '+it.power+'</p>':currentTab=='weapon'?'<p>💥 '+it.dmg+'</p>':''}${owned?(isEq?'<div class="pr" style="background:#0f8;color:#000">✅ EQUIPPED</div>':'<button class="buy eq" onclick="equipIt('+it.id+')">EQUIP</button>'):'<div class="pr">💎 '+it.price+'</div><button class="buy" onclick="buyIt('+it.id+')">BUY</button>'}`;
g.appendChild(div);
});
}
function buyIt(id){
let list=currentTab=='hero'?HEROES:currentTab=='weapon'?WEAPONS:currentTab=='pet'?PETS:SKILLS;
let it=list.find(x=>x.id==id);if(diamonds>=it.price){diamonds-=it.price;
if(currentTab=='hero'){ownedHero.push(id);equipped=id;}else if(currentTab=='weapon'){ownedWeap.push(id);equippedWeap=id;}else if(currentTab=='pet'){ownedPet.push(id);equippedPet=id;}else{ownedSkill.push(id);}
render();}else alert('Kulang diamonds boss! Patay ka muna slime/orc! 💎');
}
function equipIt(id){
if(currentTab=='hero')equipped=id;else if(currentTab=='weapon')equippedWeap=id;else if(currentTab=='pet')equippedPet=id;
render();if(currentTab=='hero')toggleShop();
}
render();
</script>
</body>
</html>
