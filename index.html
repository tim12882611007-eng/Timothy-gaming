<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Armored Battle - Red vs Purple</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080d24;overflow:hidden;height:100vh;font-family:Arial}
#game{width:100%;height:100vh;background:radial-gradient(at 50% 0%,#1a2a5a,#080d24 70%,#000 100%);display:flex;flex-direction:column}
#top{height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:#fff;font-weight:900;font-size:11px;letter-spacing:1px}
.bar{width:130px;height:14px;background:#111;border:2px solid #333;border-radius:12px;overflow:hidden}
.fill{height:100%;transition:width .35s cubic-bezier(.34,1.56,.64,1)}
#arena{flex:1;position:relative;overflow:hidden}
.char{position:absolute;bottom:88px;width:160px;height:360px;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.char img{width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 12px #000)}
#you{left:10px}
#boss{right:10px}
.vs{position:absolute;left:50%;top:16%;transform:translateX(-50%);color:gold;font-size:22px;font-weight:900;text-shadow:0 0 12px gold;letter-spacing:3px}
#fx{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;pointer-events:none;z-index:20;text-shadow:0 2px 8px #000;opacity:0;transition:all .4s;text-align:center}
#ctrl{display:flex;justify-content:center;gap:10px;padding:12px 10px 18px;background:#000;border-top:3px solid #222}
.btn{width:74px;height:68px;border-radius:18px;border:3px solid #2a3a6a;background:linear-gradient(145deg,#1e2e6a,#0f1a3a);color:#fff;font-weight:900;font-size:11px;letter-spacing:.5px;box-shadow:0 4px 0 #000}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 #000}
.btn.ulti{background:linear-gradient(145deg,#ffcc00,#ff8800);color:#000;border-color:gold;box-shadow:0 0 18px gold,0 4px 0 #000}
#lobby{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:#1a2a5a;border:2px solid #445;padding:9px 20px;border-radius:24px;font-weight:900;font-size:11px;color:#fff;letter-spacing:1px}
</style>
</head>
<body>
<div id="game">
<div id="top">
<div>YOU<div class="bar"><div id="hpYou" class="fill" style="width:100%;background:linear-gradient(90deg,#00ff88,#00ccff)"></div></div></div>
<div>VS</div>
<div>BOSS<div class="bar"><div id="hpBoss" class="fill" style="width:100%;background:linear-gradient(90deg,#ff00ff,#ff0000)"></div></div></div>
</div>

<div id="arena">
<div class="vs">BATTLE</div>
<div id="you" class="char"><img src="you.png" alt="YOU"></div>
<div id="boss" class="char"><img src="boss.png" alt="BOSS"></div>
<div id="fx"></div>
</div>

<div id="ctrl">
<button class="btn" onclick="punch()">PUNCH</button>
<button class="btn" onclick="skill()">SKILL</button>
<button class="btn ulti" onclick="ulti()">ULTI</button>
<button class="btn" onclick="sword()">SWORD</button>
</div>

<button id="lobby" onclick="location.reload()">LOBBY</button>
</div>

<script>
let youHp=100,bossHp=100;
let you=document.getElementById('you'),boss=document.getElementById('boss');

function showFx(text,color){
let f=document.getElementById('fx');
f.style.opacity='1';f.style.color=color||'gold';f.innerText=text;
f.style.transform='translate(-50%,-50%) scale(1.5)';
setTimeout(()=>{f.style.transform='translate(-50%,-90px) scale(1)';f.style.opacity='0'},380);
}

function punch(){
you.style.transform='translateX(48px) scale(1.12)';
you.style.filter='drop-shadow(0 0 25px #ff0000)';
setTimeout(()=>{
let dmg=16;
bossHp-=dmg;if(bossHp<0)bossHp=0;
document.getElementById('hpBoss').style.width=bossHp+'%';
boss.style.transform='translateX(-28px) scale(.9)';
setTimeout(()=>boss.style.transform='',220);
showFx('PUNCH -'+dmg,'#ffcc00');
you.style.transform='';you.style.filter='';
if(bossHp<=0){showFx('YOU WIN','gold');set
