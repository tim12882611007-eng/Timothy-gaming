<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAL DUEL</title><style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#000;color:#fff;font-family:Arial;overflow:hidden;height:100vh}.top{position:absolute;top:0;left:0;right:0;background:#000;padding:6px;display:flex;justify-content:space-around;z-index:10;border-bottom:2px solid gold;font-size:11px}.top b{color:gold}#game{width:100vw;height:100vh;background:linear-gradient(#1a2a4a 45%,#1a2a0a 45%);display:block}.controls{position:absolute;bottom:0;left:0;right:0;height:130px;display:flex;justify-content:space-between;padding:10px;z-index:10}.joy{width:100px;height:100px;background:rgba(255,255,255,.1);border-radius:50%;border:2px solid #fff3;position:relative}.stick{width:44px;height:44px;background:gold;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}.sbtn{width:60px;height:60px;border-radius:50%;border:3px solid gold;background:#000a;display:flex;align-items:center;justify-content:center;font-size:22px}.lobby{position:absolute;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center}.lobby.hide{display:none}.btn{background:gold;color:#000;border:none;padding:12px 24px;border-radius:24px;font-weight:900;margin:8px}.hpBar{position:absolute;top:35px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10}.hpBox{width:44%;height:14px;background:#222;border:2px solid #555;border-radius:8px;overflow:hidden}.hpFill{height:100%;background:#0f0;width:100%;transition:.3s}.hpBox.e.hpFill{background:red}</style></head><body>
<div class="top"><span>💰<b id="gold">1500</b></span><span>⭐LV<b id="lv">1</b></span><span>🏆<b id="wins">0</b></span><span id="rank">Bronze</span></div>
<div class="hpBar"><div class="hpBox"><div class="hpFill" id="ph"></div></div><div class="hpBox e"><div class="hpFill" id="eh"></div></div></div>
<canvas id="game"></canvas>
<div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div style="display:flex;gap:8px"><div class="sbtn" id="blockBtn">🛡️</div><div class="sbtn" id="atkBtn">⚔️</div><div class="sbtn" id="dashBtn">💨</div><div class="sbtn" id="ultBtn">👑</div></div></div>
<div class="lobby" id="lobby"><h2 style="color:gold">⚔️ REAL TAO DUEL ⚔️</h2><p style="font-size:11px;color:#0f0">Tao talaga porma - may kamay paa espada!</p><button class="btn" onclick="start()">▶️ PLAY DUEL</button></div>
<div class="lobby hide" id="winLob"><h1 style="color:gold">PANALO!</h1><button class="btn" onclick="nextDuel()">NEXT</button></div>
<script>
cvs=document.getElementById('game');ctx=cvs.getContext('2d');function rs(){cvs.width=innerWidth;cvs.height=innerHeight}rs();addEventListener('resize',rs);
let gold=1500,wins=0,level=1,run=false,keys={};let player={x:200,y:0,hp:100,max:100,dir:1,state:'idle',atkT:0,block:false,dashT:0,anim:0,vy:0},enemy={x:600,y:0,hp:100,max:100,dir:-1,state:'idle',atkT:0,block:false,anim:0,aiT:0,vy:0},slashes=[],particles=[],ground=0,joy={x:0,y:0,active:false};
function start(){player.hp=100;enemy.hp=100;ground=innerHeight-130;player.y=ground-90;enemy.y=ground-90;player.x=200;enemy.x=innerWidth-200;run=true;lobby.classList.add('hide');loop()}
function loop(){if(!run)return;upd();draw();requestAnimationFrame(loop)}
function upd(){let ix=0;if(keys['a']||joy.x<0)ix=-1;if(keys['d']||joy.x>0)ix=1;if(joy.active)ix=joy.x;if(player.state!='atk'&&player.dashT<=0){player.x+=ix*5;if(ix!=0)player.dir=ix>0?1:-1;player.state=ix!=0?'run':'idle'}player.anim+=player.state=='run'?0.25:0.08;if(player.atkT>0){player.atkT--;if(player.atkT==0)player.state='idle'}if(player.dashT>0){player.dashT--;player.x+=player.dir*10}player.y=ground-90;player.x=Math.max(40,Math.min(innerWidth-40,player.x));enemy.aiT++;if(enemy.aiT>20){let d=enemy.x-player.x;if(Math.abs(d)>90){enemy.x+=Math.sign(-d)*2.8;enemy.dir=Math.sign(-d)>0?1:-1;enemy.state='run'}else if(Math.random()<0.05){enemy.state='atk';enemy.atkT=24;slashes.push({x:enemy.x+enemy.dir*50,y:enemy.y+18,t:18})}enemy.aiT=0}enemy.anim+=0.1;if(enemy.atkT>0){enemy.atkT--;if(enemy.atkT==0)enemy.state='idle'}enemy.y=ground-90;enemy.x=Math.max(40,Math.min(innerWidth-40,enemy.x));slashes.forEach((s,i)=>{s.t--;if(s.t<=0)slashes.splice(i,1)});let dist=Math.abs(player.x-enemy.x);if(player.state=='atk'&&player.atkT==10&&dist<110){if(!enemy.block){enemy.hp-=30;slashes.push({x:enemy.x,y:enemy.y+10,t:14,type:'hit'});enemy.x+=player.dir*22;if(enemy.hp<=0)win()}else{slashes.push({x:(player.x+enemy.x)/2,y:ground-60,t:12,type:'block'})}}if(enemy.state=='atk'&&enemy.atkT==10&&dist<110){if(!player.block){player.hp-=20;slashes.push({x:player.x,y:player.y+10,t:14,type:'hit'});player.x+=enemy.dir*20;if(player.hp<=0)gameOver()}else{slashes.push({x:(player.x+enemy.x)/2,y:ground-60,t:12,type:'block'})}}ph.style.width=(player.hp)+'%';eh.style.width=(enemy.hp)+'%';goldEl();}function goldEl(){document.getElementById('gold').innerText=gold;document.getElementById('lv').innerText=level;document.getElementById('wins').innerText=wins}
function draw(){ctx.fillStyle='#1a2a4a';ctx.fillRect(0,0,innerWidth,ground);ctx.fillStyle='#1a2a0a';ctx.fillRect(0,ground,innerWidth,innerHeight-ground);drawHuman(player.x,player.y,player,'#3a6aff','🤴');drawHuman(enemy.x,enemy.y,enemy,'#ff3a3a','👹');slashes.forEach(s=>{if(!s.type||s.type!='block'){ctx.save();ctx.translate(s.x,s.y);ctx.strokeStyle='gold';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,40,-0.8,0.8);ctx.stroke();ctx.restore()}else{ctx.font='18px Arial';ctx.fillText('🛡️ CLANG!',s.x-30,s.y)}if(s.type=='hit'){ctx.font='24px Arial';ctx.fillText('💥',s.x-12,s.y-10)}})}
function drawHuman(x,y,p,col,head){ctx.save();ctx.translate(x,y);if(p.dir<0)ctx.scale(-1,1);let run=Math.sin(p.anim)*20;let atk=p.state=='atk'?Math.sin((24-p.atkT)/24*Math.PI)*-70:0;ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,90,26,7,0,0,6.28);ctx.fill();ctx.save();ctx.translate(-6,50);ctx.rotate(run*0.6*Math.PI/180);ctx.fillStyle='#222';ctx.fillRect(-5,0,10,30);ctx.restore();ctx.save();ctx.translate(6,50);ctx.rotate(-run*0.6*Math.PI/180);ctx.fillStyle='#222';ctx.fillRect(-5,0,10,30);ctx.restore();ctx.fillStyle=col;ctx.fillRect(-12,6,24,42);ctx.fillStyle='gold';ctx.fillRect(-13,36,26,4);ctx.save();ctx.translate(-13,14);ctx.rotate(run*0.3*Math.PI/180);ctx.fillStyle='#ffdbac';ctx.fillRect(-4,-4,8,24);ctx.restore();ctx.save();ctx.translate(13,14);ctx.rotate((atk+run*-0.2)*Math.PI/180);ctx.fillStyle='#ffdbac';ctx.fillRect(-4,-4,8,26);ctx.save();ctx.translate(2,26);ctx.rotate(-20*Math.PI/180);ctx.fillStyle='#ccc';ctx.fillRect(-2,0,4,44);ctx.fillStyle='gold';ctx.fillRect(-5,0,10,6);ctx.restore();ctx.restore();ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(0,-8,13,0,6.28);ctx.fill();ctx.font='16px Arial';ctx.fillText(head,-8,-3);}ctx.restore()}
function playerAtk(t){if(player.atkT>0)return;player.state='atk';player.atkT=24;slashes.push({x:player.x+player.dir*50,y:player.y+18,t:18})}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==' ')playerAtk()});addEventListener('keyup',e=>{keys[e.key]=false});
atkBtn.ontouchstart=()=>playerAtk();dashBtn.ontouchstart=()=>{player.dashT=14};blockBtn.ontouchstart=()=>player.block=true;blockBtn.ontouchend=()=>player.block=false;ultBtn.ontouchstart=()=>{player.state='atk';player.atkT=36;for(let k=0;k<3;k++)setTimeout(()=>slashes.push({x:player.x+player.dir*50,y:player.y+10,t:16}),k*100)};
joyEl=document.getElementById('joy');stickEl=document.getElementById('stick');joyEl.addEventListener('touchstart',()=>joy.active=true);joyEl.addEventListener('touchmove',e=>{let r=joyEl.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=35;if(d>m){dx=dx/d*m;dy=dy/d*m}joy.x=dx/m;stickEl.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`});joyEl.addEventListener('touchend',()=>{joy.active=false;joy.x=0;stickEl.style.transform='translate(-50%,-50%)'});
function win(){run=false;wins++;gold+=150;winLob.classList.remove('hide')}function nextDuel(){winLob.classList.add('hide');start()}function gameOver(){run=false;alert('TALO!');lobby.classList.remove('hide')}
</script></body></html>
